# HAProxy as a TCP passthrough proxy. Same question as nginx.conf, different
# implementation -- the point of testing more than one is that "middlebox
# compatibility" is a property of each product, not of the category.
global
    log stdout format raw local0

defaults
    mode    tcp
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend pqc_in
    bind *:4433
    default_backend pqc_out

backend pqc_out
    server s1 server:4433
