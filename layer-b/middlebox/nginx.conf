# nginx as a TCP passthrough proxy in front of the PQC server.
#
# Passthrough, not TLS-terminating, is the honest first middlebox case: it asks
# whether a box that is not even trying to inspect the handshake nonetheless
# damages it. Larger PQC ClientHellos are exactly the kind of thing that trips
# fixed buffer assumptions in software written when a ClientHello was small.
#
# A TLS-terminating variant is a different question (does the proxy itself
# support the group) and belongs in its own scenario, not folded into this one.
# The official nginx images ship `stream` as a DYNAMIC module and load it via
# /etc/nginx/modules-enabled/, which is included by the stock nginx.conf.
# Replacing nginx.conf wholesale -- which is what mounting this file does --
# drops that include, so the module has to be loaded explicitly or every
# `stream` directive is an unknown directive at startup.
load_module modules/ngx_stream_module.so;

worker_processes  1;
events { worker_connections 1024; }

stream {
    upstream backend {
        server server:4433;
    }
    server {
        listen 4433;
        proxy_pass backend;
        proxy_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
