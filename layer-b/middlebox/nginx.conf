# nginx as a TCP passthrough proxy in front of the PQC server.
#
# Passthrough, not TLS-terminating, is the honest first middlebox case: it asks
# whether a box that is not even trying to inspect the handshake nonetheless
# damages it. Larger PQC ClientHellos are exactly the kind of thing that trips
# fixed buffer assumptions in software written when a ClientHello was small.
#
# A TLS-terminating variant is a different question (does the proxy itself
# support the group) and belongs in its own scenario, not folded into this one.
# NOTE ON IMAGE VARIANTS. `stream` support differs between official nginx
# images: the Debian variants ship it as a dynamic module under
# /etc/nginx/modules/, while the alpine variant does not carry that .so at all.
# An explicit `load_module` therefore fixes one variant and breaks the other.
# This config assumes stream is already available, and the middlebox scenario
# defaults to HAProxy -- a single static binary with no module system -- so
# that a proxy product's packaging quirk cannot be mistaken for a PQC
# compatibility finding.
worker_processes  1;
events { worker_connections 1024; }

stream {
    upstream backend {
        server server:4433;
    }
    server {
        listen 4433;
        proxy_pass backend;
        proxy_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
