# HAProxy in HTTP mode, on its DEFAULT tune.bufsize.
#
# As with the nginx config beside it, no buffer tuning is applied. A probe that
# raised the limit would measure this file; a probe that lowered it would
# manufacture the finding.
global
    log stdout format raw local0 info

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend fe
    bind *:8080
    default_backend be

backend be
    server origin compat-nginx:8080 check
