# nginx as a plain HTTP origin, on its DEFAULT header buffers.
#
# large_client_header_buffers is deliberately NOT set here. The whole point of
# the probe is what happens to somebody who deploys without changing anything,
# and setting it -- in either direction -- would make the result a statement
# about this file rather than about nginx's default.
worker_processes  1;
events { worker_connections 1024; }

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    server {
        listen 8080;
        location / {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }
    }
}
