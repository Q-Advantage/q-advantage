name: Daily PQC Benchmark

on:
  schedule:
    # Every day at 06:00 UTC (23:00 US Pacific previous day)
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Manual trigger from the Actions tab

permissions:
  contents: write

# Serialize benchmark runs. A second trigger arriving while a run is in
# progress will queue behind it rather than running concurrently — which
# would race on benchmark/results/ writes and corrupt history.
concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: Run Q-Shield benchmark on dedicated hardware
    runs-on: [self-hosted, q-advantage-bench]
    timeout-minutes: 180

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Full history (not the default shallow clone) so that
          # rebase-on-conflict in the commit step has somewhere to land.
          fetch-depth: 0

      - name: Show environment
        run: |
          echo "Runner: $(hostname)"
          echo "CPU: $(grep -m1 'model name' /proc/cpuinfo | sed 's/.*: //')"
          echo "Kernel: $(uname -r)"
          uptime

      - name: Run benchmark — primitives
        run: |
          source ~/q-advantage/venv/bin/activate
          python3 benchmark/benchmark.py

      - name: Run benchmark — TLS composed (Layer A)
        run: |
          source ~/q-advantage/venv/bin/activate
          python3 benchmark/protocols/tls_composed.py \
            --output-dir benchmark/results/protocols

      - name: Run benchmark — SSH composed (Layer A)
        run: |
          source ~/q-advantage/venv/bin/activate
          python3 benchmark/protocols/ssh_composed.py \
            --output-dir benchmark/results/protocols

      - name: Run benchmark — signature track (Job 2)
        run: |
          source ~/q-advantage/venv/bin/activate
          python3 benchmark/protocols/sig_track.py \
            --output-dir benchmark/results/protocols

      - name: Run benchmark — AES-GCM baseline (Layer A)
        run: |
          source ~/q-advantage/venv/bin/activate
          python3 benchmark/protocols/aes_baseline.py \
            --output-dir benchmark/results/protocols

      - name: Run benchmark — LMS/XMSS stateful signatures (Layer A)
        run: |
          source ~/q-advantage/venv/bin/activate
          python3 benchmark/protocols/lms_xmss.py \
            --output-dir benchmark/results/protocols

      # --- Tracks added 2026-08-30 -------------------------------------------
      #
      # continue-on-error is deliberate and load-bearing, not defensive habit.
      # Steps in this job run sequentially and a failure aborts the job before
      # "Commit results" -- so without it, a bug in a new and comparatively
      # unproven track would stop the whole daily record from being committed.
      # The established tracks above have already written their output by this
      # point; nothing new is allowed to take them down with it.
      #
      # The cost is that a silent failure here would go unnoticed, so the
      # "New tracks - status" step below reports presence or absence into the
      # job summary. Remove continue-on-error once a track has a few weeks of
      # clean runs behind it and is no longer the newest thing in the file.

      - name: Run benchmark — IPsec/IKEv2 composed (Layer A)
        continue-on-error: true
        run: |
          source ~/q-advantage/venv/bin/activate
          python3 benchmark/protocols/ipsec_composed.py             --output-dir benchmark/results/protocols

      - name: Run benchmark — cryptographic throughput under load
        continue-on-error: true
        run: |
          source ~/q-advantage/venv/bin/activate
          python3 benchmark/protocols/concurrency.py             --output-dir benchmark/results/protocols

      - name: New tracks — status
        if: always()
        run: |
          # Reports rather than fails: these tracks must never gate the daily
          # commit, but a track that quietly stopped producing output should
          # still be visible to whoever reads the run.
          echo "### New track output" >> $GITHUB_STEP_SUMMARY
          today=$(date -u +%Y-%m-%d)
          for track in ipsec-composed concurrency; do
            if ls benchmark/results/protocols/${track}-${today}-*.json >/dev/null 2>&1; then
              echo "- \`${track}\`: wrote output" >> $GITHUB_STEP_SUMMARY
            else
              echo "- \`${track}\`: **no output this run** — check the step above" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Build protocol manifest for web
        run: |
          source ~/q-advantage/venv/bin/activate
          python3 benchmark/build_manifest.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmark/results/ web/public/data/protocols/

          if git diff --staged --quiet; then
            echo "No result changes to commit"
            exit 0
          fi

          git commit -m "chore: daily benchmark run $(date -u +%Y-%m-%d) [skip ci]"

          # The runner's local main may have fallen behind remote during the
          # benchmark window. Rebase-on-fail handles this cleanly: the only
          # file the runner ever writes is benchmark/results/, which no human
          # edits, so conflicts are not expected. If a conflict somehow
          # occurs, fail loudly rather than papering over it.
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed; rebasing on origin/main"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase produced a conflict — aborting and failing the workflow"
              git rebase --abort || true
              exit 1
            fi
          done

          echo "Push failed after 3 attempts; failing workflow"
          exit 1

      - name: Summary
        if: always()
        run: |
          if [ -f benchmark/results/RESULTS.md ]; then
            echo "## Latest benchmark results" >> $GITHUB_STEP_SUMMARY
            cat benchmark/results/RESULTS.md >> $GITHUB_STEP_SUMMARY
          fi
