name: Layer B

# Layer B's parsers are pure and run in seconds. THIS workflow does the
# expensive half: it builds the reference stack and runs real handshakes
# between real containers, one job per scenario.
#
# Deliberately NOT on every pull request -- building liboqs and oqs-provider
# from source takes minutes and nothing in web/ depends on it. It runs when
# Layer B itself changes, and on demand.
#
# What these jobs prove, and what they do not. They prove the stack negotiates,
# that a deliberately mismatched pair fails the way we claim, that N live
# connections behave, that injected latency costs what it costs, and that a
# passthrough proxy does not damage the handshake. They do NOT produce
# published figures: a handshake timed on a shared GitHub runner is not a
# Q-Shield measurement, every result says so in its own timing block, and
# assert-scenario.py fails the job if one ever claims otherwise.

on:
  push:
    paths:
      - "layer-b/**"
      - ".github/workflows/layer-b.yml"
      - "schema/layer_b_result.schema.json"
  pull_request:
    paths:
      - "layer-b/**"
      - ".github/workflows/layer-b.yml"
      - "schema/layer_b_result.schema.json"
  workflow_dispatch:

jobs:
  parsers:
    name: wire, capture and analysis parsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r benchmark/requirements-dev.txt
      - name: Parser tests
        run: python -m pytest layer-b/tests -q

  certificate-chains:
    name: certificate chain sizing
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Same image as the live-handshake jobs. Certificate generation is a
      # second use of the oqs-provider investment rather than a new dependency:
      # the measurement host's OpenSSL 3.0.13 cannot mint an ML-DSA certificate
      # at all, which is why this cannot live in the daily Layer A run.
      - name: Build the reference stack
        working-directory: layer-b
        run: docker build -t q-advantage/layer-b:dev .

      - name: Mint real chains
        working-directory: layer-b
        run: |
          mkdir -p out/certs
          # The scripts are mounted rather than baked in, so a change to them
          # does not force an image rebuild.
          docker run --rm             -v "$PWD/certs:/certs:ro"             -v "$PWD/out:/out"             -e OUT_DIR=/out/certs             q-advantage/layer-b:dev bash /certs/generate-chains.sh

      - name: Size them
        working-directory: layer-b
        run: |
          python certs/measure_chains.py             --certs-dir out/certs             --baseline ecdsa-p256             --output-dir out/results
          cat out/results/cert-chain-*.json

      - name: Assert the measurement says something
        working-directory: layer-b
        run: |
          python - <<'PY'
          import glob, json, sys
          paths = sorted(glob.glob("out/results/cert-chain-*.json"))
          if not paths:
              sys.exit("no cert-chain result was written")
          r = json.load(open(paths[-1]))

          measured = [c for c in r["chains"] if c.get("measured")]
          if len(measured) < 2:
              sys.exit("fewer than two chains were built; nothing can be compared")

          algs = {c["algorithm"] for c in measured}
          if not any(a.startswith("mldsa") for a in algs):
              sys.exit("no post-quantum chain was built — oqs-provider is not minting certificates")

          cmp = r["comparison"]
          if not cmp.get("measurable"):
              sys.exit("comparison unavailable: %s" % cmp.get("reason"))

          # The claim boundary is the thing most likely to erode. A named
          # mechanism appearing here without a citation is the failure this
          # guards, so it fails the job rather than warning.
          blob = json.dumps(r)
          for name in ("Merkle", "MTC", "draft-"):
              if name in blob:
                  sys.exit("output names a mechanism without citing it: %r" % name)

          print("chains:", ", ".join(sorted(algs)))
          for row in cmp["rows"]:
              print("  %-12s %6d B sent  %+7d B vs %s  (%.2fx)" % (
                  row["algorithm"], row["sent_der_bytes"], row["delta_bytes"],
                  cmp["baseline"], row["multiple_of_baseline"]))
          PY

      - name: Upload the chains and the measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layer-b-cert-chains
          path: |
            layer-b/out/certs/**/*.der
            layer-b/out/results/cert-chain-*.json
          if-no-files-found: warn

  compat:
    name: application compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The probe runs inside the reference stack because that is where the
      # minted certificates and a Python with `cryptography` already are.
      - name: Build the reference stack
        working-directory: layer-b
        run: docker build -t q-advantage/layer-b:dev .

      - name: Probe real software on its defaults
        working-directory: layer-b
        # Invoked through bash rather than relying on the executable bit: this
        # repo is developed on Windows, where git does not track mode by default.
        run: bash ./run-compat.sh

      - name: Fail only if the probe itself could not run
        working-directory: layer-b
        # A rejection by a front door is a FINDING, not a build failure -- the
        # whole point is to record what breaks. What must fail the job is the
        # probe not reaching its targets at all, because a run where nothing
        # connected would otherwise publish "nothing broke".
        run: |
          python - <<'EOF'
          import glob, json, sys
          files = sorted(glob.glob("out/results/app-compat-*.json"))
          if not files:
              sys.exit("no result file was written")
          r = json.load(open(files[-1]))
          doors = r["http_front_doors"]
          if not doors:
              sys.exit("no front door was probed")
          unreachable = [
              d["target"] for d in doors
              if all(v["outcome"] == "connect_failed" for v in d["by_token"].values())
          ]
          if unreachable:
              sys.exit("never reached: %s -- this is a broken probe, not a finding"
                       % ", ".join(unreachable))
          h = r["headline"]
          print("probed %d front door(s), %d algorithm(s)"
                % (h["targets_probed"], h["algorithms_probed"]))
          print("silent rejections: %d" % h["silent_rejections"])
          print("certificates invisible to a parser: %d"
                % h["certificates_invisible_to_a_parser"])
          EOF

      - name: Upload the compatibility result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layer-b-app-compat
          path: |
            layer-b/out/results/app-compat-*.json
            layer-b/out/compat-containers.log
          if-no-files-found: warn

  crosslib:
    name: "second opinion: ${{ matrix.library }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # One library per job, and one failing must not hide the others. Same
      # principle as the middlebox matrix: a build quirk in one product is not
      # a finding about another.
      fail-fast: false
      matrix:
        include:
          # `slug` exists because Docker tags must be lowercase while the
          # library's own name is what belongs in the published result. Deriving
          # one from the other in shell would put a lowercasing step between the
          # matrix and the result, which is where a mislabelled row comes from.
          - library: BoringSSL
            slug: boringssl
            dockerfile: Dockerfile.boringssl
          - library: AWS-LC
            slug: awslc
            dockerfile: Dockerfile.awslc
          - library: wolfSSL
            slug: wolfssl
            dockerfile: Dockerfile.wolfssl
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.library }} from source
        working-directory: layer-b/crosslib
        run: docker build -f ${{ matrix.dockerfile }} -t q-advantage/crosslib-${{ matrix.slug }}:dev .

      - name: Ask it what it exposes
        working-directory: layer-b
        run: |
          mkdir -p out/results
          docker run --rm -v "$PWD/out:/out" \
            -e CROSSLIB_LIBRARY="${{ matrix.library }}" \
            q-advantage/crosslib-${{ matrix.slug }}:dev \
            python3 probe_crosslib.py --output-dir /out/results
          cat out/results/crosslib-*.json

      - name: Upload this library's result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crosslib-${{ matrix.library }}
          path: layer-b/out/results/crosslib-*.json
          if-no-files-found: warn

  crosslib-merge:
    name: "second opinion: cross-validation"
    runs-on: ubuntu-latest
    needs: crosslib
    # Runs even when a library failed to build: a missing library is a missing
    # opinion, and the merged view is built to say so rather than to require a
    # complete set.
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect every library that reported
        uses: actions/download-artifact@v4
        with:
          pattern: crosslib-*
          merge-multiple: true
          path: layer-b/out/results

      - name: Cross-validate against liboqs
        working-directory: layer-b
        run: |
          python crosslib/merge_crosslib.py --results-dir out/results --output-dir out/results
          cat out/results/crosslib-merged-*.json

      - name: Fail if no library reported at all
        working-directory: layer-b
        # One library missing is a missing opinion and the merged view says so.
        # ALL of them missing is a broken build, and a run where nothing was
        # asked of anything must not go green -- otherwise the most complete
        # failure this track can have is also its quietest.
        run: |
          python - <<'EOF'
          import glob, json, sys
          f = sorted(glob.glob("out/results/crosslib-merged-*.json"))
          if not f:
              sys.exit("the merge step wrote no file")
          cv = json.load(open(f[-1]))["cross_validation"]
          if not cv["measurable"]:
              sys.exit(cv["reason"])
          print("reported: %s" % ", ".join(cv["libraries_that_reported"]))
          if cv["libraries_that_did_not"]:
              print("did NOT report: %s" % ", ".join(cv["libraries_that_did_not"]))
          EOF

      - name: Upload the merged view
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crosslib-merged
          path: layer-b/out/results/crosslib-merged-*.json
          if-no-files-found: warn

  scenarios:
    name: "live: ${{ matrix.scenario }}${{ matrix.proxy && format(' ({0})', matrix.proxy) || '' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # One scenario failing should not hide the others' findings.
      fail-fast: false
      matrix:
        include:
          - scenario: pairwise
          - scenario: mismatch
          - scenario: concurrency
          - scenario: rtt
          - scenario: middlebox
            proxy: haproxy
          # A second product, because middlebox compatibility is a property of
          # each product rather than of the category. Isolated as its own job so
          # one proxy's packaging quirk cannot hide the other's result.
          - scenario: middlebox
            proxy: nginx
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the reference stack
        working-directory: layer-b
        run: docker build -t q-advantage/layer-b:dev .

      - name: Record what actually got built
        if: matrix.scenario == 'pairwise'
        run: |
          docker run --rm q-advantage/layer-b:dev cat /layer-b/openssl-version.txt
          docker run --rm q-advantage/layer-b:dev cat /layer-b/providers.txt

      - name: Confirm the stateful signature flags took
        if: matrix.scenario == 'pairwise'
        # Layer A's LMS/XMSS harness has reported unavailable since 2026-08-14
        # because the measurement host's liboqs lacks these. Proving them here
        # de-risks the rebuild on the box that produces the product's data.
        run: |
          docker run --rm q-advantage/layer-b:dev bash -lc \
            'ls /usr/local/include/oqs/sig_stfl.h && echo "stateful signature headers present"'

      - name: Run the scenario
        working-directory: layer-b
        # Invoked through bash rather than relying on the executable bit: this repo
        # is developed on Windows, where git does not track mode by default.
        env:
          PROXY: ${{ matrix.proxy }}
        run: bash ./run-scenario.sh ${{ matrix.scenario }}

      - name: Assert it established what it claims to
        working-directory: layer-b
        run: python assert-scenario.py ${{ matrix.scenario }}

      - name: Upload capture and result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layer-b-${{ matrix.scenario }}${{ matrix.proxy && format('-{0}', matrix.proxy) || '' }}
          path: |
            layer-b/out/*.pcap
            layer-b/out/*.csv
            layer-b/out/*.log
            layer-b/out/results/*.json
          if-no-files-found: warn
